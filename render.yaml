services:
  # Backend API server
  - type: web
    name: agentgate-server
    runtime: node
    rootDir: packages/server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: PUBLISHER_ADDRESS
        value: 0x05a7Ae061c14847e0B70f7851d76FC10289d69b0
      - key: PLATFORM_ADDRESS
        value: 0x05a7Ae061c14847e0B70f7851d76FC10289d69b0
      - key: POSTGRES_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      # HMAC secret for chat-session tokens issued to the paywall after
      # USDC payment. Set in the Render dashboard (owner-only). If unset
      # the server derives a deterministic fallback from PRIVATE_KEY and
      # warns at boot.
      - key: SESSION_SECRET
        sync: false

  # Frontend dashboard (static site)
  - type: web
    name: agentgate-dashboard
    runtime: static
    rootDir: packages/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_SERVER_URL
        value: https://agentgate-server.onrender.com
